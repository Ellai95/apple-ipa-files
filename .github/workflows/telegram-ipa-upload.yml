name: Telegram IPA pilot transfer (authorized only)

on:
  workflow_dispatch:
    inputs:
      telegram_post_urls:
        description: "1-5 direct https://t.me/channel/message links to IPA files"
        required: true
        type: string
      distribution_rights_confirmed:
        description: "I have permission to redistribute the selected IPA files"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: telegram-ipa-pilot-transfer
  cancel-in-progress: false

jobs:
  pilot:
    if: ${{ inputs.distribution_rights_confirmed }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telethon
        run: python -m pip install --disable-pip-version-check telethon==1.45.0

      - name: Download authorized IPA on runner and upload to GitHub Release
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCES: ${{ inputs.telegram_post_urls }}
        run: |
          python scripts/telegram_ipa_upload.py \
            --urls "$SOURCES" \
            --output telegram-ipa-transfer-report.json

      - name: Upload metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-ipa-pilot-report
          path: telegram-ipa-transfer-report.json
          if-no-files-found: ignore
          retention-days: 7
