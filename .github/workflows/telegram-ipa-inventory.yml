name: Telegram IPA inventory (metadata only)

on:
  workflow_dispatch:
    inputs:
      channels:
        description: "Comma-separated Telegram channel usernames"
        required: true
        type: string
        default: "@IAppsBestLibrary,@islamusamanov,@privateipa,@unlimipa,@kamohacks"
      max_messages_per_channel:
        description: "Maximum messages to inspect in each channel"
        required: true
        type: string
        default: "10000"

permissions:
  contents: read

concurrency:
  group: telegram-ipa-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Telethon
        run: python -m pip install --disable-pip-version-check telethon==1.45.0

      - name: Scan channel metadata (does not download IPA files)
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          CHANNELS: ${{ inputs.channels }}
          MAX_MESSAGES_PER_CHANNEL: ${{ inputs.max_messages_per_channel }}
        run: |
          python scripts/telegram_ipa_inventory.py \
            --channels "$CHANNELS" \
            --limit "$MAX_MESSAGES_PER_CHANNEL" \
            --output telegram-ipa-inventory.json

      - name: Upload inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-ipa-inventory
          path: telegram-ipa-inventory.json
          if-no-files-found: ignore
          retention-days: 7
