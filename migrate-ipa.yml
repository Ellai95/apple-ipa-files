name: Apple IPA - Server Transfer

'on':
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-ipa-release-migration
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PLAN_ZLIB_BASE64: 
  MIGRATION_SCRIPT: |
    """One-time release migration on GitHub-hosted Linux runners. Standard library only."""
    import argparse
    import base64
    import hashlib
    import http.client
    import json
    import os
    from pathlib import Path
    import re
    import subprocess
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    import zlib
    
    DEST = 'Ellai95/apple-ipa-files'
    TAG = 'ipa-archive-1'
    SOURCE_PREFIX = '/ZAUr0/r4n7-files/releases/download/'
    R2_HOST = 'pub-d11175355ab34b9299fb0a916702bce7.r2.dev'
    SHARDS = 4
    
    
    def emit(message):
        print(message, flush=True)
    
    
    def load_plan():
        plan = json.loads(zlib.decompress(base64.b64decode(os.environ['PLAN_ZLIB_BASE64'])))
        if os.environ.get('GITHUB_REPOSITORY') != DEST:
            raise RuntimeError('Run this workflow only in ' + DEST)
        seen_assets, seen_keys = set(), set()
        for item in plan:
            u = urllib.parse.urlsplit(item['source'])
            if u.scheme != 'https' or u.username or u.password or u.port not in (None, 443):
                raise ValueError('Invalid source URL')
            if not ((u.hostname == 'github.com' and u.path.startswith(SOURCE_PREFIX)) or u.hostname == R2_HOST):
                raise ValueError('Unapproved source host/path')
            name = item['asset']
            if not re.fullmatch(r'[A-Za-z0-9_-]+\.ipa', name) or item['tag'] != TAG:
                raise ValueError('Invalid destination name/tag')
            if name in seen_assets or item['key'] in seen_keys:
                raise ValueError('Duplicate destination/source')
            seen_assets.add(name)
            seen_keys.add(item['key'])
            if not isinstance(item['size'], int) or not 0 <= item['size'] < 2 * 1024**3:
                raise ValueError('Missing or unsupported size')
            digest = item.get('sourceDigest', '')
            if digest and not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                raise ValueError('Invalid source digest')
        return plan
    
    
    def api(endpoint, method='GET', payload=None):
        body = None if payload is None else json.dumps(payload).encode()
        for attempt in range(4):
            request = urllib.request.Request('https://api.github.com/repos/' + DEST + '/' + endpoint,
                data=body, method=method, headers={
                    'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json',
                    'X-GitHub-Api-Version': '2022-11-28',
                    'User-Agent': 'Apple-IPA-release-migration'})
            try:
                with urllib.request.urlopen(request, timeout=120) as response:
                    raw = response.read()
                    return json.loads(raw) if raw else None
            except urllib.error.HTTPError as error:
                if error.code not in (429, 500, 502, 503, 504) and not (
                    error.code == 403 and (error.headers.get('Retry-After') or error.headers.get('X-RateLimit-Remaining') == '0')):
                    raise
                if attempt == 3:
                    raise
                wait = min(60, max(5, int(error.headers.get('Retry-After', '15'))))
                emit('API temporarily unavailable; retrying in %ds.' % wait)
                time.sleep(wait)
    
    
    def get_release():
        return api('releases/tags/' + TAG)
    
    
    def list_assets(release_id):
        result = {}
        for page in range(1, 20):
            rows = api('releases/%s/assets?per_page=100&page=%d' % (release_id, page))
            for asset in rows:
                result[asset['name']] = asset
            if len(rows) < 100:
                return result
        raise RuntimeError('Too many assets')
    
    
    def prepare():
        plan = load_plan()
        try:
            release = get_release()
        except urllib.error.HTTPError as error:
            if error.code != 404:
                raise
            release = api('releases', 'POST', {
                'tag_name': TAG, 'target_commitish': os.environ['GITHUB_REF_NAME'],
                'name': 'Apple IPA application files', 'body': 'Application archives.',
                'draft': False, 'prerelease': False, 'make_latest': 'false'})
        if release.get('immutable'):
            raise RuntimeError('This release is immutable')
        emit('Release ready: %d files, %.2f GiB, %d parallel jobs.' % (
            len(plan), sum(x['size'] for x in plan) / 1024**3, SHARDS))
    
    
    def split_plan(plan):
        buckets = [[] for _ in range(SHARDS)]
        totals = [0] * SHARDS
        for item in sorted(plan, key=lambda x: (-x['size'], x['asset'])):
            index = min(range(SHARDS), key=lambda i: (totals[i], i))
            buckets[index].append(item)
            totals[index] += item['size']
        return buckets
    
    
    def sha_file(path):
        digest = hashlib.sha256()
        with path.open('rb') as stream:
            for chunk in iter(lambda: stream.read(4 * 1024**2), b''):
                digest.update(chunk)
        return digest.hexdigest()
    
    
    def download(url, path, expected):
        # No auth token is ever sent to public source/redirect hosts.
        for attempt in range(3):
            emit(('Downloading %.1f MiB' % (expected / 1024**2) if expected else 'Downloading IPA with unknown size') + ' (attempt %d/3).' % (attempt + 1))
            result = subprocess.run(['curl', '--fail', '--location', '--proto', '=https',
                '--proto-redir', '=https', '--connect-timeout', '30', '--max-time', '1800',
                '--speed-limit', '1024', '--speed-time', '120', '--retry', '2',
                '--output', str(path), url], stdin=subprocess.DEVNULL)
            if result.returncode == 0 and path.exists() and 0 < path.stat().st_size < 2 * 1024**3 and (not expected or path.stat().st_size == expected):
                with path.open('rb') as stream:
                    if stream.read(4) not in (b'PK\x03\x04', b'PK\x05\x06'):
                        raise RuntimeError('Source is not a ZIP/IPA archive')
                return sha_file(path)
            path.unlink(missing_ok=True)
        raise RuntimeError('Source download failed or size differs from plan')
    
    
    def matches(asset, size, digest):
        if asset.get('state') != 'uploaded' or asset.get('size') != size:
            return False
        if asset.get('digest'):
            return asset['digest'] == 'sha256:' + digest
        # GitHub assets without a server digest are verified by streaming download.
        request = urllib.request.Request(asset['browser_download_url'], headers={'User-Agent': 'Apple-IPA-migration'})
        check = hashlib.sha256()
        received = 0
        with urllib.request.urlopen(request, timeout=120) as response:
            for chunk in iter(lambda: response.read(4 * 1024**2), b''):
                received += len(chunk)
                check.update(chunk)
        return received == size and check.hexdigest() == digest
    
    
    def upload(release_id, path, name):
        size = path.stat().st_size
        conn = http.client.HTTPSConnection('uploads.github.com', timeout=120)
        try:
            target = '/repos/%s/releases/%s/assets?name=%s' % (DEST, release_id, urllib.parse.quote(name, safe=''))
            conn.putrequest('POST', target)
            for key, value in {
                'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/octet-stream', 'Content-Length': str(size),
                'User-Agent': 'Apple-IPA-release-migration'}.items():
                conn.putheader(key, value)
            conn.endheaders()
            started = last = time.monotonic()
            sent = 0
            with path.open('rb') as stream:
                for chunk in iter(lambda: stream.read(2 * 1024**2), b''):
                    conn.send(chunk)
                    sent += len(chunk)
                    now = time.monotonic()
                    if now - last >= 10:
                        emit('Sent %.0f%%, %.1f/%.1f MiB, average %.1f MiB/s.' % (
                            100 * sent / size, sent / 1024**2, size / 1024**2,
                            sent / 1024**2 / max(now - started, 0.001)))
                        last = now
            emit('File sent; waiting for GitHub confirmation.')
            response = conn.getresponse()
            raw = response.read()
            if response.status != 201:
                raise RuntimeError('GitHub upload HTTP %s: %s' % (response.status, raw.decode(errors='replace')[:500]))
            return json.loads(raw)
        finally:
            conn.close()
    
    
    def record(item, asset, digest):
        return {'source': item['source'], 'url': asset['browser_download_url'],
            'asset': item['asset'], 'size': item['size'], 'sha256': digest,
            'names': item['names'], 'fileName': item['fileName']}
    
    
    def write_json(path, value):
        path.parent.mkdir(parents=True, exist_ok=True)
        temp = path.with_suffix('.tmp')
        temp.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n')
        temp.replace(path)
    
    
    def copy_shard(index):
        plan = load_plan()
        items = split_plan(plan)[index]
        release = get_release()
        existing = list_assets(release['id'])
        completed, failures = {}, []
        out = Path('results') / ('shard-%d.json' % index)
        write_json(out, {'completed': completed, 'failures': failures})
        for number, original_item in enumerate(items, 1):
            item = dict(original_item)
            path = Path('current.ipa')
            emit('\n[%d/%d] %s' % (number, len(items), item['fileName']))
            try:
                asset = existing.get(item['asset'])
                known = item.get('sourceDigest', '').removeprefix('sha256:')
                if asset and known and matches(asset, item['size'], known):
                    emit('Already verified on GitHub; skipping download and upload.')
                    completed[item['key']] = record(item, asset, known)
                    continue
                if asset and (asset.get('state') != 'uploaded' or (item['size'] and asset.get('size') != item['size'])):
                    raise RuntimeError('Existing destination asset is incomplete/different; preserved, not overwritten')
                digest = download(item['source'], path, item['size'])
                item['size'] = path.stat().st_size
                if known and digest != known:
                    raise RuntimeError('Source SHA-256 mismatch')
                if asset:
                    if not matches(asset, item['size'], digest):
                        raise RuntimeError('Existing destination differs; preserved, not overwritten')
                    emit('Existing GitHub copy verified; upload skipped.')
                else:
                    try:
                        asset = upload(release['id'], path, item['asset'])
                    except Exception:
                        # A lost response does not imply a failed upload. Check before retrying.
                        asset = list_assets(release['id']).get(item['asset'])
                        if not asset or not matches(asset, item['size'], digest):
                            raise
                    if not matches(asset, item['size'], digest):
                        raise RuntimeError('GitHub copy failed size/SHA-256 verification')
                    emit('Uploaded and SHA-256 verified.')
                    existing[item['asset']] = asset
                completed[item['key']] = record(item, asset, digest)
            except Exception as error:
                message = str(error)
                emit('ERROR: ' + message)
                failures.append({'asset': item['asset'], 'error': message})
            finally:
                path.unlink(missing_ok=True)
                write_json(out, {'completed': completed, 'failures': failures})
        emit('Job complete: %d verified, %d failed.' % (len(completed), len(failures)))
        if failures:
            raise RuntimeError('Some files failed; successful files remain on GitHub. Rerun the workflow to continue.')
    
    
    def finalize():
        plan = load_plan()
        merged, failures = {}, []
        for path in sorted(Path('results').rglob('shard-*.json')):
            data = json.loads(path.read_text())
            merged.update(data['completed'])
            failures.extend(data['failures'])
        assets = list_assets(get_release()['id'])
        verified = {}
        for item in plan:
            row = merged.get(item['key'])
            asset = assets.get(item['asset'])
            if row and row['asset'] == item['asset'] and (not item['size'] or row['size'] == item['size']) and asset and matches(asset, row['size'], row['sha256']):
                verified[item['key']] = row
        missing = [item['asset'] for item in plan if item['key'] not in verified]
        complete = not missing
        state = {'repository': DEST, 'completed': verified, 'transferComplete': complete, 'plannedCount': len(plan)}
        write_json(Path('migration-result/state.json'), state)
        write_json(Path('migration-result/mapping.json'), verified)
        write_json(Path('migration-result/missing.json'), {'missing': missing, 'failures': failures})
        write_json(Path('migration-result/plan.json'), plan)
        message = 'Verified %d/%d IPA files. %s' % (len(verified), len(plan),
            'TRANSFER COMPLETE. Catalog links have not been changed.' if complete else 'INCOMPLETE: rerun workflow to continue.')
        emit(message)
        summary = os.environ.get('GITHUB_STEP_SUMMARY')
        if summary:
            with open(summary, 'a') as stream:
                stream.write(message + '\n\nDownload the `migration-result` artifact for mapping.json and state.json.\n')
        if not complete:
            raise RuntimeError('%d files are not verified' % len(missing))
    
    
    if __name__ == '__main__':
        parser = argparse.ArgumentParser()
        parser.add_argument('mode', choices=['prepare', 'copy', 'finalize'])
        parser.add_argument('--shard', type=int, choices=range(SHARDS), default=0)
        args = parser.parse_args()
        if args.mode == 'prepare': prepare()
        elif args.mode == 'copy': copy_shard(args.shard)
        else: finalize()

jobs:
  prepare:
    name: Prepare destination release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Prepare migration script
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('migrate.py').write_text(os.environ['MIGRATION_SCRIPT'])
          PY
      - name: Check plan and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 migrate.py prepare

  transfer:
    name: Transfer group ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Prepare migration script
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('migrate.py').write_text(os.environ['MIGRATION_SCRIPT'])
          PY
      - name: Download, upload and verify IPA
        timeout-minutes: 325
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHARD: ${{ matrix.shard }}
        run: python3 migrate.py copy --shard "$SHARD"
      - name: Save verified files even after a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-shard-${{ matrix.shard }}
          path: results/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  verify:
    name: Final verification and mapping
    needs: [prepare, transfer]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Prepare migration script
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('migrate.py').write_text(os.environ['MIGRATION_SCRIPT'])
          PY
      - name: Collect migration results
        uses: actions/download-artifact@v4
        with:
          pattern: migration-shard-*
          path: results
          merge-multiple: true
      - name: Verify all destination assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 migrate.py finalize
      - name: Save mapping, progress and missing files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-result
          path: migration-result/
          if-no-files-found: warn
          retention-days: 30
